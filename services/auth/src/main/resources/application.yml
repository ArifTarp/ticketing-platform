server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5432/ticketing_auth
    username: auth_app
    password: auth_app_pw
  flyway:
    locations: classpath:db/migration

# Demo/local-only JWT signing secret. NEVER use a hardcoded secret like this in production —
# in a real deployment this would come from a secrets manager (Vault, AWS Secrets Manager, etc.)
# and be rotated. Fine for this interview-showcase demo only.
management:
  endpoints:
    web:
      exposure:
        include: health,info

auth:
  jwt:
    # Shared with the gateway (which verifies what this service signs) via the same env var and the
    # same local-dev default — see docs/adr/0002-hmac-shared-secret-jwt-validation.md.
    secret: "${TICKETING_JWT_SECRET:1e5e6f3c8a2b4d7e9f0c1a3b5d7e9f1c3a5b7d9e1f3a5c7b9d1e3f5a7c9b1d3e}"
    expiration-seconds: 3600
