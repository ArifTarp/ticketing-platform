services:
  postgres:
    image: postgres:16-alpine
    container_name: ticketing-postgres
    environment:
      POSTGRES_USER: ticketing
      POSTGRES_PASSWORD: ticketing
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-multi-db.sh:/docker-entrypoint-initdb.d/init-multi-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketing -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    container_name: ticketing-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Two client-facing listeners: PLAINTEXT for host-machine clients (advertised as
      # localhost, reached via the published port), INTERNAL for other containers on this
      # compose network (advertised as the service name, resolvable via Docker's embedded DNS).
      # A single "localhost"-advertised listener works for host clients but breaks any future
      # app container that joins this network, since it would be told to reconnect to its own
      # loopback instead of the kafka container.
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: ticketing-demo-cluster-id-1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # One-shot init container: creates the application topics (payment.commands, payment.events,
  # booking.events) explicitly instead of relying on Kafka auto-create, so partition count /
  # replication factor are deliberate (see infra/kafka/create-topics.sh) rather than whatever the
  # broker's auto-create defaults happen to be. Uses the INTERNAL listener (kafka:29092) since
  # this runs as another container on the compose network, per the dual-listener setup above.
  kafka-topics-init:
    image: apache/kafka:3.8.0
    container_name: ticketing-kafka-topics-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infra/kafka/create-topics.sh:/create-topics.sh:ro
    environment:
      BOOTSTRAP_SERVER: kafka:29092
    entrypoint: ["/bin/sh", "/create-topics.sh"]
    restart: "no"

  redis:
    image: redis:7-alpine
    container_name: ticketing-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Phase 7: bookings CRUD + Redis seat holds (no saga/Kafka wiring yet — that lands in Phase 8,
  # see services/booking/CLAUDE.md). No app service is containerized here yet for any other
  # backend module either, so this doesn't mirror an existing app-service block in this file;
  # it follows the datasource-role/env-var conventions already established by
  # infra/postgres/init-multi-db.sh and services/event's application.yml (Spring env vars
  # override the same relaxed-binding properties for the containerized run, while the module's
  # own application.yml keeps localhost defaults for running it directly via Maven).
  booking:
    build:
      # Context is the repo root, not services/booking/, because this is a multi-module Maven
      # build and booking depends on the sibling `messaging` module — see the Dockerfile's own
      # header comment for the full rationale.
      context: .
      dockerfile: services/booking/Dockerfile
    container_name: ticketing-booking
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ticketing_booking
      SPRING_DATASOURCE_USERNAME: booking_app
      SPRING_DATASOURCE_PASSWORD: booking_app_pw
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # OpenTelemetry Java agent (bundled into the image, see Dockerfile) -> Elastic APM Server's
      # native OTLP/HTTP ingest endpoint on port 8200. Traces + metrics only for this demo (logs
      # stay as structured JSON on stdout, not double-shipped via OTel) — see root CLAUDE.md's
      # observability entry and this compose file's elasticsearch/kibana/apm-server blocks below.
      OTEL_SERVICE_NAME: booking
      OTEL_EXPORTER_OTLP_ENDPOINT: http://apm-server:8200
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=ticketing-platform,deployment.environment=local
      OTEL_LOGS_EXPORTER: none
      OTEL_METRICS_EXPORTER: none
      OTEL_INSTRUMENTATION_LOGBACK_MDC_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      apm-server:
        condition: service_healthy

  # Phase 8: mock payment provider. Kafka-only — no inbound REST, so no port is published for
  # client access and it must never be added to the gateway's routes (see gateway/CLAUDE.md).
  # Mirrors the booking block's build/env/depends_on style; the "8084:8084" mapping below only
  # exists for local debugging/actuator access, not for gateway routing.
  payment:
    build:
      # Context is the repo root, not services/payment/ — see the booking block above / the
      # Dockerfile's own header comment for the multi-module Maven build rationale.
      context: .
      dockerfile: services/payment/Dockerfile
    container_name: ticketing-payment
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ticketing_payment
      SPRING_DATASOURCE_USERNAME: payment_app
      SPRING_DATASOURCE_PASSWORD: payment_app_pw
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # See the booking block's comment above for what these do.
      OTEL_SERVICE_NAME: payment
      OTEL_EXPORTER_OTLP_ENDPOINT: http://apm-server:8200
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=ticketing-platform,deployment.environment=local
      OTEL_LOGS_EXPORTER: none
      OTEL_METRICS_EXPORTER: none
      OTEL_INSTRUMENTATION_LOGBACK_MDC_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      apm-server:
        condition: service_healthy

  # Phase 9: pure booking.events consumer (notification "sends" mock mail/SMS). Kafka-only — no
  # inbound REST, so no gateway route (same rule as the payment block above); no Redis dependency
  # either, unlike booking. Mirrors the payment block's build/env/depends_on style.
  notification:
    build:
      # Context is the repo root, not services/notification/ — see the booking block above / the
      # Dockerfile's own header comment for the multi-module Maven build rationale.
      context: .
      dockerfile: services/notification/Dockerfile
    container_name: ticketing-notification
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ticketing_notification
      SPRING_DATASOURCE_USERNAME: notification_app
      SPRING_DATASOURCE_PASSWORD: notification_app_pw
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # See the booking block's comment above for what these do.
      OTEL_SERVICE_NAME: notification
      OTEL_EXPORTER_OTLP_ENDPOINT: http://apm-server:8200
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=ticketing-platform,deployment.environment=local
      OTEL_LOGS_EXPORTER: none
      OTEL_METRICS_EXPORTER: none
      OTEL_INSTRUMENTATION_LOGBACK_MDC_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      apm-server:
        condition: service_healthy

  # --- Observability stack: OpenTelemetry traces/metrics -> Elastic APM Server -> Elasticsearch,
  # visualized in Kibana. Single-node, security/TLS disabled — local demo only, per root
  # CLAUDE.md's observability entry. Do not reuse this config as a template for anything
  # internet-facing.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.10
    container_name: ticketing-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 60s

  kibana:
    image: docker.elastic.co/kibana/kibana:9.1.10
    container_name: ticketing-kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:5601/api/status | grep -q '\"level\":\"available\"'"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 60s

  # Elastic APM Server: exposes a native OTLP gRPC+HTTP ingest endpoint on the same port (8200) as
  # its classic intake API (protocol-detected per request — no separate OTel Collector needed),
  # and ships everything it receives to elasticsearch. See services/booking|payment|notification's
  # OTEL_EXPORTER_OTLP_ENDPOINT env vars above, which point straight at this service.
  apm-server:
    image: docker.elastic.co/apm/apm-server:9.1.10
    container_name: ticketing-apm-server
    # -e: log to stderr instead of a file, standard for running in a container.
    # strict.perms=false: default apm-server.yml ownership checks assume a bare-metal install;
    # skip them here rather than fighting file-permission bits inside the image.
    command: >
      -e
      -E output.elasticsearch.hosts=["elasticsearch:9200"]
      -E apm-server.host=0.0.0.0:8200
      -E strict.perms=false
    ports:
      - "8200:8200"
    depends_on:
      elasticsearch:
        condition: service_healthy
    # No curl/wget in this image (RHEL UBI minimal + coreutils only) — use bash's /dev/tcp to
    # confirm the OTLP/intake HTTP port is actually accepting connections.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8200"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

volumes:
  postgres-data:
  elasticsearch-data:
